[package]
name = "deco-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GTK4/libadwaita app to manage TP-Link Deco mesh networks"

[[bin]]
name = "deco-app"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
deco-api = { path = "../deco-api" }
dotenvy = "0.15"
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
