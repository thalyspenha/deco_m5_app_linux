[package]
name = "deco-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client for the TP-Link Deco local HTTP API"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
form_urlencoded = "1"
hex = "0.4"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
dotenvy = "0.15"
